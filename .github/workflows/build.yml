name: Build tr4mpass Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Windows Cross-Compilation Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          mingw-w64 \
          binutils-mingw-w64

    - name: Install Development Packages for Cross-Compiling
      run: |
        sudo apt-get install -y \
          mingw-w64-tools \
          libusb-1.0-0-dev \
          libplist-dev \
          libssl-dev \
          libssh2-1-dev \
          libcurl4-openssl-dev \
          libimobiledevice-dev \
          libirecovery-1.0-dev || sudo apt-get install -y libirecovery-dev

    - name: Compile Application to Windows EXE
      run: |
        # We override the internal test check line so it doesn't try to run the Windows binary on Linux
        make CC=x86_64-w64-mingw32-gcc .chip-db-canary="echo Skipping test canary check" tr4mpass

    - name: Upload compiled Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: tr4mpass-Windows-EXE
        path: ./*.exe
