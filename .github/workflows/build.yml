name: Build tr4mpass Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Build Tools & Windows Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          mingw-w64

    - name: Compile Application to Windows EXE
      run: |
        # This forces your Makefile to compile a Windows executable (.exe)
        make CC=x86_64-w64-mingw32-gcc

    - name: Upload compiled Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: tr4mpass-Windows-App
        path: ./*.exe
