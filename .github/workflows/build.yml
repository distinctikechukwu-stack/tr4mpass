name: Build Windows GUI Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up GCC (MinGW)
      uses: egor-tisin/setup-mingw@v2
      with:
        platform: x64

    - name: Compile Application using Makefile
      run: |
        mingw32-make

    - name: Upload compiled EXE
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Desktop-App
        path: ./*.exe
